name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate curriculum records
        shell: pwsh
        run: .\scripts\Build-CurriculumMaps.ps1 -ValidateOnly

      - name: Test curriculum map rejection cases
        shell: pwsh
        run: .\scripts\Test-CurriculumMaps.ps1

      - name: Validate complete lesson references
        shell: pwsh
        run: .\scripts\Test-LessonReferences.ps1

      - name: Validate external candidate maps
        shell: pwsh
        run: .\scripts\Build-ExternalAlignment.ps1 -ValidateOnly

      - name: Validate materials budgets
        shell: pwsh
        run: .\scripts\Test-MaterialsBudget.ps1

      - name: Validate Kindergarten references
        shell: pwsh
        run: .\scripts\Test-KindergartenReferences.ps1

      - name: Validate Snap Circuits references
        shell: pwsh
        run: .\scripts\Test-SnapCircuitsReferences.ps1

      - name: Build documentation
        run: mkdocs build --strict

      - name: Deploy MkDocs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
